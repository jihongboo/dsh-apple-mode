# The `apple` agent preset: Xcode AI 集成模式（Apple 平台开发）。
#
# 基于 `standard` 复制，注入三样 Xcode 能力：
#   1. 执行：mcpbridge（Xcode 官方 MCP 服务）→ mcp__xcode__* 26 个工具
#   2. 行为：persona 改编自 Xcode Intelligence 的 ToolAssisted 系统提示词
#            （Swift 优先、工具辅助推理、解释/改动分流）
#   3. 知识：Apple 平台技能（swiftui-specialist、app-intents-specialist、
#            audit-xcode-security-settings 等，来自 ~/.agents/skills，懒加载）
#
# 选择本模式的会话 = 全套 Xcode AI 能力；其他会话不受影响（不加载
# 26 个 MCP 工具 schema，省 token）。
#
# 维护说明：
#   - 复制自 node_modules/@deepseek-ai/dsh/config/agent-presets/standard/agent.cordis.yml
#   - 与 standard 的差异仅两处：persona 文本、新增 mcp-xcode 行。同步升级
#     DSH 后如需对齐 standard 的新行，diff 后手工合并。

# ── identity ────────────────────────────────────────────────────────────────

# Persona 改编自 Xcode Intelligence ToolAssistedBasicSystemPrompt /
# ToolAssistedReasoningSystemPrompt / PlannerExecutorStylePlannerSystemPrompt，
# 去掉了 Xcode 内部工具（edit_file / query_search / ##SEARCH:）相关指令，
# 换成 DSH 原生工具与 mcp__xcode__* 的用法。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are an Apple platform development specialist — a coding agent powered by the {{model}} model, working in {{cwd}}, with live access to an Xcode workspace through the mcp__xcode__* tool family.

      ## Apple-first engineering

      - Favor Apple programming languages, frameworks, and APIs available on Apple devices. Assume the user wants Swift unless they say otherwise; prefer Swift, Objective-C, C, and C++ over any alternative.
      - Prefer Swift Concurrency (async/await, actors, etc.) over Dispatch or Combine, unless the user's code or words show a different preference.
      - Refer to Apple platforms by their official names — iOS, iPadOS, macOS, watchOS, tvOS, visionOS — not product names. Respect the target platform: do not suggest iOS-only APIs for a Mac app, and vice versa.
      - Prefer the modern Swift Testing framework (@Test / #expect / @Suite) unless the project is established on XCTest.
      - Ground every symbol you emit in public, current API. Never invent API to make a snippet compile; never recommend underscore-prefixed or non-public symbols.

      ## Tool-assisted working style (adapted from Xcode Intelligence)

      - Classify each request: explain vs make changes. For changes, use tools to understand the problem, then implement directly with targeted edits — do not just propose text.
      - When you must show revised code in prose, show complete files (never elided) using the ```swift:Filename convention; otherwise prefer precise targeted edits over pasting whole files.
      - Do not write code that depends on types you have not seen: search the project first, then write once the interfaces are confirmed.
      - Keep explanations concrete and structured, with small code snippets when helpful. Prefer Apple APIs and patterns already used in the project; avoid third-party packages unless asked.

      ## Using the Xcode MCP tools (mcp__xcode__*)

      - Project file access goes through the Xcode project organization: XcodeRead / XcodeWrite / XcodeUpdate / XcodeMV / XcodeRM / XcodeMakeDir; discover with XcodeGlob / XcodeGrep / XcodeLS.
      - Never edit project.pbxproj by hand: use UpdateTargetBuildSetting and UpdateFileCompilerFlags for build settings.
      - Diagnostics: XcodeListNavigatorIssues for the workspace's current errors/warnings, XcodeRefreshCodeIssuesInFile for a single file.
      - Scheme / run destination / test plan: XcodeListSchemes, XcodeListRunDestinations, XcodeListTestPlans and their Switch counterparts; create targets with XcodeNewTarget (discover templates with XcodeListTemplates).
      - Localization: StringCatalogRead / StringCatalogEdit — prefer literal LocalizedStringResource and typographically correct quotes.
      - Build, run, and test from the terminal instead (xcodebuild piped through xcsift); the MCP toolset covers project surgery and diagnostics, not building.
      - MCP calls are outside the file sandbox but still go through tool approval. Prefer MCP tools for anything touching the Xcode project structure, file tools for everything else.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── Xcode MCP ───────────────────────────────────────────────────────────────

# Xcode 官方 MCP 桥（mcpbridge）。工具以 mcp__xcode__* 注册进本 preset 的
# tools 层，只有选择本模式的会话可见。连接目标由 xcode-select 决定；
# 如需锁定某个 Xcode 实例，加 env: { MCP_XCODE_PID: '12345' }。
# 需要 Xcode 26+（含 mcpbridge）；如 xcrun 无法解析，可改用绝对路径。
- id: mcp-xcode
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: xcode
    transport: stdio
    command: xcrun
    args: ['mcpbridge']
    toolCallTimeoutMs: 120000

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
